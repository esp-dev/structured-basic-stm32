name: Console tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  console:
    name: Native console / ASan and UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the STM32 port
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read the BASIC submodule revision
        id: basic
        run: |
          revision=$(git rev-parse --verify HEAD:basic)
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"
      - name: Check out the pinned BASIC submodule
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/structured-basic
          ref: ${{ steps.basic.outputs.revision }}
          path: basic
          ssh-key: ${{ secrets.BASIC_CORE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Verify the pinned BASIC revision
        run: test "$(git -C basic rev-parse HEAD)" = "$(git rev-parse HEAD:basic)"
      - name: Configure
        run: >-
          cmake -S . -B build/host -G Ninja -DCMAKE_C_COMPILER=clang
          "-DCMAKE_C_FLAGS=-g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=all"
      - name: Build
        run: cmake --build build/host
      - name: Test
        run: ctest --test-dir build/host --output-on-failure
